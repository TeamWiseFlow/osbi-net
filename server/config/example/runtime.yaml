# OSBI-net server runtime configuration (example only).
#
# Production deployments copy this file outside the repository and point
# OSBI_CONFIG_FILE (or OSBI_CONFIG_DIR/runtime.yaml) at the copy. Never edit
# the repository example for production; it carries no secrets.
#
# Paths are resolved relative to this file's directory. The example uses the
# package's own schemas so it runs from a source checkout; a real deployment
# normally points at /etc/osbi-net/schemas/... and /var/lib/osbi-server.

server:
  protocol: material-extract/v4
  dataDir: ./data
  defaultStore: policy
  models:
    baseUrl: https://api.siliconflow.cn/v1
    apiKeyEnv: OSBI_LLM_API_KEY
    selected: deepseek-ai/DeepSeek-V3.2
    # Compatibility field kept for deployments that still carry the old
    # performance model; the OSBI server itself does not produce infos.
    performance: Qwen/Qwen3-32B
    ontology: Qwen/Qwen3.5-27B
    fallback: deepseek-ai/DeepSeek-V3.2
    concurrency: 3
    timeoutSeconds: 240
    ontologyChunkChars: 3000
    ontologyChunkOverlap: 200
  batch:
    enabled: true
    windowStart: "01:18"
    windowEnd: "06:18"
    timezone: Asia/Shanghai
    maxSeconds: 14400
  auth:
    mode: node-key
    keysFile: nodes.keys.example.json
  stores:
    policy:
      title: 政策与治理图谱
      schemaPath: ../../wiseflow_server/schemas/policy.ttl
    economy:
      title: 经济动态图谱
      schemaPath: ../../wiseflow_server/schemas/economy.ttl
  seeds:
    - ../../wiseflow_server/schemas/seeds_shanghai.ttl
    # Add city skeletons as they are prepared, e.g.
    # - ./seeds/chengdu.ttl

# Global channel catalogue. Channels are shared by every authenticated node;
# statement is the server-owned relevance definition and is never uploaded by
# a node. dateWindowDays is an ingestion gate only (not a query gate).
channels:
  - id: party-building
    title: 基层党建
    schemaRef: policy
    statement: >-
      基层党建与党建引领基层治理：基层党组织建设、党员教育管理、党群服务阵地、主题党日、
      物业党建、两企三新党建、新兴就业群体党建、党建引领网格化治理、街乡吹哨部门报到、
      新时代枫桥经验、全过程人民民主、基层减负、党建引领社区治理创新。
    dateWindowDays: null
  - id: economy
    title: 经济动态
    schemaRef: economy
    statement: >-
      经济形势、稳定增长、促进就业、货币政策、稳定物价、提振经济、降准降息、
      稳定楼市股市、高质量发展、新质生产力、蓝色生产力、协作生产力、绿色经济。
    dateWindowDays: null
  - id: community
    title: 社区治理
    schemaRef: policy
    statement: >-
      社区治理与居民服务：社区治理、基层治理创新、先进工作经验/案例/人物/事迹、居民自治、
      物业管理与三方协同、老旧小区改造、加装电梯、一老一小、居家养老、助老食堂、普惠托育、
      困难群众兜底、就业帮扶、文明实践、志愿服务、移风易俗、垃圾分类、市容环境、爱国卫生。
    dateWindowDays: null
  - id: digital
    title: 数字社区
    schemaRef: policy
    statement: >-
      数字治理与智慧社区：公共数据、数据流通、AI政务、数字居委会、数字社工、一网统管、
      一网通办、随申办、城市运行体系、城运中心、12345接诉即办、数字吹哨、网格化数字平台、
      智慧社区场景、数据赋能基层减负。
    dateWindowDays: null
  - id: policy-latest
    title: 政策速递
    schemaRef: policy
    statement: >-
      最近三天内发布的政策、政策公告、政策公示、政策解读、规范性文件、实施意见、
      规划纲要及配套文件。
    dateWindowDays: 3
    dateField: publishedDate
    rules:
      policyContent: true
  - id: stability
    title: 平安维稳
    schemaRef: policy
    statement: >-
      平安建设与社会稳定风险化解：矛盾纠纷排查化解、信访与投诉办理、群体性事件和突发事件处置、
      社会稳定风险评估、社会治安综合治理、流动人口和出租房管理、重点人群服务管理、舆情监测与稳控、
      基层平安创建。
    dateWindowDays: null
  - id: production-safety
    title: 安全生产
    schemaRef: policy
    statement: >-
      安全生产与应急管理：生产安全、消防安全、燃气安全、食品安全、特种设备安全、防灾减灾、
      隐患排查治理、节假日安保、重大活动安全保障、应急演练与救援。
    dateWindowDays: null

# Node identities. Nodes only provide provenance and sourceScope=own filtering;
# every authenticated node may submit to and query every channel.
nodes:
  - id: example-node-a
    name: Example node A
  - id: example-node-b
    name: Example node B
