[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osbi-net"
version = "0.1.0"
description = "Shared business intelligence graphs and local acquisition clients"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "idna>=3,<4"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "rdflib>=7.1,<8", "pyoxigraph>=0.5,<0.6", "PyYAML>=6,<7", "aiosqlite>=0.22,<0.23", "loguru>=0.8,<0.9", "regex>=2026.1"]
client = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.20,<2", "beautifulsoup4>=4.12,<5", "feedparser>=6,<7", "sqlcipher3-binary>=0.6,<0.7", "zstandard>=0.25,<0.26", "python-docx>=1.1,<2", "websockets>=13,<18", "python-dotenv>=1,<2"]
test = ["pytest>=8,<10", "PyYAML>=6,<7", "cryptography>=43"]

[project.scripts]
osbi-server = "wiseflow_server.__main__:main"
osbi-client = "osbi_client.cli:main"
osbi-mcp = "osbi_client.mcp:main"

[tool.setuptools.packages.find]
where = ["contracts", "server", "client/backend"]
namespaces = false

[tool.setuptools.package-data]
wiseflow_server = ["schemas/*.ttl", "schemas/*.json", "static/*"]
osbi_client = ["static/*", "url_rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["contracts", "server", "client/backend"]
