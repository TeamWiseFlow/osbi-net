[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osbi-net"
version = "0.1.0"
description = "Shared business intelligence graphs and local acquisition clients"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "idna>=3,<4"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "rdflib>=7.1,<8", "pyoxigraph>=0.5,<0.6"]
client = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.20,<2", "beautifulsoup4>=4.12,<5", "feedparser>=6,<7"]
test = ["pytest>=8,<10", "PyYAML>=6,<7", "cryptography>=43"]

[project.scripts]
osbi-server = "osbi_server.cli:main"
osbi-client = "osbi_client.cli:main"
osbi-mcp = "osbi_client.mcp:main"

[tool.setuptools.packages.find]
where = ["contracts", "server", "client/backend"]
namespaces = false

[tool.setuptools.package-data]
osbi_server = ["schemas/*.ttl", "schemas/*.json"]
osbi_client = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["contracts", "server", "client/backend"]
